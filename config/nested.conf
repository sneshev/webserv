server {
	listen localhost:8080;
	root ./www;

    autoindex off;
    allowed_methods GET;

    location / {
        location /images {
            autoindex on;
            allowed_methods GET POST;

            location /images/icons {
				# inherits from /images 
            }
        }
    }

	location /images/other_icons {
		# inherits from server, NOT /images!
	}
}