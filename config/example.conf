server {
	listen 127.0.0.1:8080;
	listen 127.0.0.1:8081;

	root ./www;
    index index.html;

	client_max_body_size 1k;

	error_page 404 /error_pages/404.html;
	error_page 405 /error_pages/405.html;

	location / {
        allowed_methods GET;
        root ./www;
        index index.html;
        autoindex off;
		client_max_body_size 1k;
	}

	location /uploads {
        allowed_methods GET POST DELETE;
		root ./www/uploads;
		autoindex on;
		client_max_body_size 1k;
		upload_path .;
	}

	location /nothing {
		return 301 /;
	}
}