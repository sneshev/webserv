server {
    listen 127.0.0.1:8080;

    root ./www;

    client_max_body_size 10M;

    error_page 404 ./errors/404.html;
    error_page 500 ./errors/500.html;

    location / {
        allowed_methods GET POST DELETE;
        root ./www;
        index index.html;
        autoindex off;
    }

    location /upload {
        allowed_methods GET POST DELETE;
        root ./www;
        upload_path ./www/uploads;
    }

    location /public {
        allowed_methods GET;
        root ./www/public;
        index index.html;
        autoindex on;
    }

    location /old {
        return 301 /new;
    }

    location /cgi-bin {
        allowed_methods GET POST;
        root ./www/cgi-bin;

        cgi .py /usr/bin/python3;
    }
}

server {
    listen 127.0.0.1:8081;

    root ./www/second;

    client_max_body_size 5M;

    error_page 404 ./errors/404.html;

    location / {
        allowed_methods GET;
        root ./www/second;
        index index.html;
    }
}